sql_user_name = "%{User-Name}"

authorize_check_query = "\
    SELECT id, username, attribute, value, op \
    FROM ${authcheck_table} \
    WHERE username = '%{SQL-User-Name}' \
    ORDER BY id"

authorize_reply_query = "\
    SELECT id, username, attribute, value, op \
    FROM ${authreply_table} \
    WHERE username = '%{SQL-User-Name}' \
    ORDER BY id"

authorize_group_check_query = "\
    SELECT id, groupname, attribute, value, op \
    FROM ${groupcheck_table} \
    WHERE groupname = '%{${group_attribute}}' \
    ORDER BY id"

authorize_group_reply_query = "\
    SELECT id, groupname, attribute, value, op \
    FROM ${groupreply_table} \
    WHERE groupname = '%{${group_attribute}}' \
    ORDER BY id"

group_membership_query = "\
    SELECT groupname \
    FROM ${usergroup_table} \
    WHERE username = '%{SQL-User-Name}' \
    ORDER BY priority"

accounting_start_query = "\
    INSERT INTO ${acct_table1} \
        (acctsessionid, acctuniqueid, username, groupname, realm, \
         nasipaddress, nasportid, nasporttype, \
         acctstarttime, acctupdatetime, \
         acctauthentic, connectinfo_start, connectinfo_stop, \
         acctinputoctets, acctoutputoctets, calledstationid, \
         callingstationid, acctterminatecause, servicetype, \
         framedprotocol, framedipaddress) \
    VALUES \
        ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', \
         '%{SQL-User-Name}', '%{%{SQL-Group}}%', \
         '%{Realm}', '%{NAS-IP-Address}', '%{NAS-Port}', \
         '%{NAS-Port-Type}', \
         %S, %S, \
         '%{Acct-Authentic}', '%{Connect-Info}', '', \
         '0', '0', \
         '%{Called-Station-Id}', '%{Calling-Station-Id}', \
         '', '%{Service-Type}', \
         '%{Framed-Protocol}', '%{Framed-IP-Address}')"

accounting_start_query_alt = "\
    UPDATE ${acct_table1} SET \
        acctstarttime = %S, \
        acctupdatetime = %S, \
        acctauthentic = '%{Acct-Authentic}', \
        connectinfo_start = '%{Connect-Info}', \
        calledstationid = '%{Called-Station-Id}', \
        callingstationid = '%{Calling-Station-Id}', \
        servicetype = '%{Service-Type}', \
        framedprotocol = '%{Framed-Protocol}', \
        framedipaddress = '%{Framed-IP-Address}' \
    WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

accounting_update_query = "\
    UPDATE ${acct_table1} \
    SET acctupdatetime = NOW(), \
        acctinterval = %{%{Acct-Interval}:-NULL}, \
        framedipaddress = '%{Framed-IP-Address}', \
        acctsessiontime = %{%{Acct-Session-Time}:-NULL}, \
        acctinputoctets = '%{%{Acct-Input-Octets}:-0}', \
        acctoutputoctets = '%{%{Acct-Output-Octets}:-0}' \
    WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

