services:
  certbot:
    image: certbot/certbot
    container_name: certbot
    ports:
      - "80:80"
    volumes:
      - ./strongswan/config/swanctl:/swanctl
      - ./certbot/deploy.sh:/scripts/deploy.sh:ro
      - ./certbot/data:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      - DOMAIN=${DOMAIN:-vpn.example.com}
    entrypoint: /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --quiet --webroot --webroot-path /var/www/certbot \
          --deploy-hook /scripts/deploy.sh;
        sleep 43200;
      done "

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./strongswan/config/swanctl/x509/serverCert.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./strongswan/config/swanctl/private/serverKey.pem:/etc/nginx/certs/privkey.pem:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - radius
    restart: unless-stopped
