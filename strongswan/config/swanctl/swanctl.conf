# /etc/swanctl/swanctl.conf
connections {
    rw-eap-radius {
        version = 2
        mobike = no
        proposals = aes256-sha256-modp2048
        pools = rw-pool

        local {
            auth = pubkey
            certs = serverCert.pem
            id = quomaleque.ru
            send_cert = always
        }
        remote {
            auth = eap-radius
            eap_id = %any
        }
        children {
            net {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256-sha256
            }
        }
    }
}

pools {
    rw-pool {
        addrs = 10.10.10.0/24
    }
}