# /etc/swanctl/swanctl.conf
connections {
    rw-eap-radius {
        version = 2
        mobike = no
        proposals = aes256-sha256-modp2048

        local {
            auth = pubkey
            certs = serverCert.pem
            id = quomaleque.ru
        }
        remote {
            auth = eap-radius
            eap_id = %any
        }
        children {
            net {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256-sha256
            }
        }
    }
}

pools {
    rw-pool {
        addrs = 10.10.10.0/24
    }
}

secrets {
    # Здесь могут быть EAP-секреты, если вы не используете RADIUS,
    # но в вашей схеме они не нужны, т.к. аутентификация идет через RADIUS.
    # Однако, если вы используете сертификаты клиентов, их можно добавить сюда.
}