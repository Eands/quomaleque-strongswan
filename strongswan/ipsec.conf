# /etc/ipsec.conf - strongSwan IPSec configuration

config setup
    charondebug="ike 4, knl 4, cfg 4, net 4, enc 4"
    uniqueids=no

conn %default
    ikelifetime=24h
    keylife=1h
    rekeymargin=3m
    keyingtries=1
    keyexchange=ikev2
    mobike=no
    dpdaction=clear
    dpddelay=300s
    dpdtimeout=60s

conn ikev2-vpn
    left=%any
    leftid=@quomaleque.ru
    leftcert=server-cert.pem
    leftsendcert=always
    leftsubnet=0.0.0.0/0
    right=%any
    rightid=%any
    rightauth=eap-radius
    rightsourceip=@@IPSEC_POOL@@
    rightdns=@@DNS@@
    eap_identity=%any
    auto=add
