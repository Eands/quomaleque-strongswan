x-strongswan: &strongswan-base
  build:
    context: ./strongswan
    dockerfile: Dockerfile
  cap_add:
    - NET_ADMIN
  network_mode: host
  restart: unless-stopped

volumes:
  certs:

services:
  # ======================== DEV + PROD ========================
  strongswan:
    <<: *strongswan-base
    container_name: strongswan
    volumes:
      - ./strongswan/config/swanctl:/etc/swanctl

  toughradius:
    image: talkincode/toughradius:latest
    container_name: toughradius
    network_mode: host
    volumes:
      - ./toughradius/config/toughradius.yml:/etc/toughradius/toughradius.yml:ro
      - ./toughradius/data:/data
    restart: unless-stopped

  # ======================== ТОЛЬКО PROD ========================
  strongswan-prod:
    <<: *strongswan-base
    container_name: strongswan-prod
    profiles: [ prod ]
    volumes:
      - certs:/etc/swanctl/x509:ro
      - certs:/etc/swanctl/x509ca:ro
      - certs:/etc/swanctl/private:ro

  nginx:
    profiles: [ prod ]
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - toughradius
    restart: unless-stopped

  certbot:
    profiles: [ prod ]
    image: certbot/certbot
    container_name: certbot
    ports:
      - "80:80"
    volumes:
      - certs:/certs:rw
      - ./certbot/deploy.sh:/scripts/deploy.sh:ro
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      - DOMAIN=${DOMAIN:-vpn.example.com}
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --quiet --webroot --webroot-path /var/www/certbot
      --deploy-hook /scripts/deploy.sh;
      sleep 604800;
      done"
    restart: unless-stopped
