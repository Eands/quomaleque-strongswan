volumes:
  vici_socket:

services:
  strongswan:
    image: jesusdf/docker-strongswan:latest
    container_name: strongswan
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - RADIUS_ADDR=${RADIUS_ADDR:-172.17.0.1:1812}
      - RADIUS_SECRET=${RADIUS_SECRET:-HpE98gAFA4OaJaHYU46M}
    volumes:
      - ./strongswan/config/strongswan.conf:/etc/strongswan.conf:ro
      - ./strongswan/config/swanctl:/etc/swanctl
      - vici_socket:/var/run
    restart: unless-stopped

  radius:
    build:
      context: ./radius
      dockerfile: Dockerfile
    container_name: vpn-radius
    ports:
      - "8080:8080"
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      strongswan:
        condition: service_started
    environment:
      - DB_PATH=/data/users.db
      - RADIUS_SECRET=${RADIUS_SECRET:-HpE98gAFA4OaJaHYU46M}
    volumes:
      - ./data:/data
      - vici_socket:/var/run
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
