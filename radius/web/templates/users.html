<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - VPN Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/vpn">VPN</a>
        <a href="/sessions">Sessions</a>
        <a href="/logs">Logs</a>
        <a href="/stats">Stats</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </nav>
    <div class="container">
        <h1>Users</h1>
        <a href="/users/create" class="btn">Create User</a>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {{range .users}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Username}}</td>
                    <td>{{if .IsActive}}Active{{else}}Disabled{{end}}</td>
                    <td>
                        <a href="/users/{{.ID}}/edit">Edit</a>
                        <form method="POST" action="/users/{{.ID}}/toggle" style="display:inline">
                            <button type="submit">{{if .IsActive}}Disable{{else}}Enable{{end}}</button>
                        </form>
                        <form method="POST" action="/users/{{.ID}}/edit?_method=DELETE" style="display:inline">
                            <button type="submit" onclick="return confirm('Delete user?')">Delete</button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
