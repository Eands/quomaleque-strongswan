<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - VPN Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/vpn">VPN</a>
        <a href="/sessions">Sessions</a>
        <a href="/logs">Logs</a>
        <a href="/stats">Stats</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </nav>
    <div class="container">
        <h1>Settings</h1>
        <table>
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                    <th>Updated</th>
                </tr>
            </thead>
            <tbody>
                {{range .settings}}
                <tr>
                    <td>{{.Key}}</td>
                    <td>{{.Value}}</td>
                    <td>{{.UpdatedAt}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
