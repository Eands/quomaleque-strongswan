<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessions - VPN Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/vpn">VPN</a>
        <a href="/sessions">Sessions</a>
        <a href="/logs">Logs</a>
        <a href="/stats">Stats</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </nav>
    <div class="container">
        <h1>Sessions</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>IP</th>
                    <th>Session ID</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Input</th>
                    <th>Output</th>
                </tr>
            </thead>
            <tbody>
                {{range .sessions}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Username}}</td>
                    <td>{{.FramedIP}}</td>
                    <td>{{.SessionID}}</td>
                    <td>{{.StartTime}}</td>
                    <td>{{if .EndTime}}{{.EndTime}}{{else}}Active{{end}}</td>
                    <td>{{.InputOctets}}</td>
                    <td>{{.OutputOctets}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
