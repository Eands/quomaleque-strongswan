<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - VPN Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/vpn">VPN</a>
        <a href="/sessions">Sessions</a>
        <a href="/logs">Logs</a>
        <a href="/stats">Stats</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </nav>
    <div class="container">
        <h1>RADIUS Logs</h1>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Username</th>
                    <th>Type</th>
                    <th>Result</th>
                    <th>Client IP</th>
                </tr>
            </thead>
            <tbody>
                {{range .logs}}
                <tr>
                    <td>{{.Timestamp}}</td>
                    <td>{{.Username}}</td>
                    <td>{{.RequestType}}</td>
                    <td>{{.Result}}</td>
                    <td>{{.ClientIP}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
